[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esa-attendance"
version = "2.0.0"
description = "QR-code attendance tracking for Master ESA (Streamlit + Supabase)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gilles de Truchis" }]

dependencies = [
    "streamlit>=1.36,<2.0",      # >=1.36 required for st.Page / st.navigation
    "supabase>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "qrcode[pil]>=7.4.2,<9.0",
    "Pillow>=10.0",
    "bcrypt>=4.1,<5.0",          # replaces the SHA-256 + fixed-salt hashing
    "openpyxl>=3.1",             # rosters exported from Excel by the registrar
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# -----------------------------------------------------------------------------
# Deployment note (Streamlit Cloud)
# -----------------------------------------------------------------------------
# Streamlit Cloud installs from requirements.txt and does NOT run `pip install .`
# on the repository itself. To keep the src/ layout working there, app.py
# prepends src/ to sys.path before importing esa_attendance. Locally, prefer:
#     pip install -e ".[dev]"
